  <text x="700" y="300" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="1.5" fill="#8A9BB0">Defensive consulting skills  ·  EU/DACH-ready  ·  agentskills.io</text>

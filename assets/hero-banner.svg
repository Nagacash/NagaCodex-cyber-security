  <text x="700" y="230" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="10" fill="url(#steel)">CYBER SECURITY</text>
